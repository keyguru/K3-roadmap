<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyGuru Roadmap</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;font-size:13px}
.app{padding:20px;min-width:900px}
h1{font-size:16px;font-weight:500;margin-bottom:16px;color:#3d3d3a}
.toolbar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
button{font-size:12px;padding:5px 12px;border:0.5px solid #b0afa8;border-radius:6px;background:#fff;cursor:pointer;color:#3d3d3a}
button:hover{background:#f0efea}
button.primary{background:#185FA5;color:#fff;border-color:#185FA5}
button.primary:hover{background:#0C447C}
button.danger{background:#fff;color:#A32D2D;border-color:#A32D2D}
button.danger:hover{background:#FCEBEB}
.status{font-size:11px;margin-left:4px;min-width:200px;display:flex;align-items:center;gap:5px}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.legend{display:flex;gap:14px;margin-left:auto;align-items:center;font-size:11px;color:#73726c}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-swatch{width:22px;height:10px;border-radius:3px;flex:none}
.gantt-wrap{overflow-x:auto;border:0.5px solid #d3d1c7;border-radius:10px;background:#fff;position:relative}
.gantt{min-width:max-content;position:relative}
#dep-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:15}
.header-row{display:flex;border-bottom:1px solid #e8e7e2;position:sticky;top:0;background:#f8f7f3;z-index:20}
.header-left{width:160px;flex:none;padding:8px 10px;font-size:10px;font-weight:500;color:#888;border-right:1px solid #e8e7e2}
.header-weeks{display:flex;flex:1;position:relative}
.week-hdr{flex:none;width:56px;text-align:center;padding:4px 0;border-right:0.5px solid #e8e7e2;font-size:9px;color:#aaa;line-height:1.4}
.week-hdr.month-start{border-left:2px solid #d3d1c7}
.week-num{font-weight:500;color:#666;font-size:10px}
.section-hdr{display:flex;align-items:center;background:#f0efea;border-bottom:0.5px solid #e0dfd9;border-top:0.5px solid #e0dfd9;padding:6px 10px;font-size:11px;font-weight:500;color:#5f5e5a;position:sticky;left:0;z-index:10}
.section-hdr .avatar{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;margin-right:8px;flex:none}
.row{display:flex;align-items:center;border-bottom:0.5px solid #eeecea;min-height:38px}
.row-left{width:160px;flex:none;border-right:1px solid #e8e7e2;padding:0 10px;display:flex;align-items:center;min-height:38px;background:#fff;position:sticky;left:0;z-index:5;gap:4px}
.row-label{font-size:11px;color:#73726c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;flex:1;min-width:0}
.row-label:focus{outline:none;color:#1a1a18}
.row-del{flex:none;width:14px;height:14px;border-radius:3px;background:none;border:none;color:#ccc;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.row-del:hover{color:#A32D2D;background:#FCEBEB}
.timeline{flex:1;position:relative;min-height:38px;display:flex;align-items:center}
.week-bg{display:flex;position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.week-bg-cell{flex:none;width:56px;height:100%;border-right:0.5px solid #f0efea}
.week-bg-cell.month-start{border-left:2px solid #e8e7e2}
.week-bg-cell.today-cell{background:rgba(226,75,74,0.04)}

/* Bar base */
.bar{position:absolute;height:26px;border-radius:5px;cursor:grab;display:flex;align-items:center;padding:0 8px 0 7px;font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;user-select:none;z-index:3;transition:opacity .15s,box-shadow .15s}
.bar:active{cursor:grabbing;z-index:100}

/* Status colors - wip/done/idea */
.bar.done{background:#DAEAF7;border:1px solid #185FA5;color:#0C447C}
.bar.wip {background:#FEF3C7;border:1px solid #BA7517;color:#633806}
.bar.idea{background:#EAF3DE;border:1px solid #3B6D11;color:#27500A}

/* Category: product — bold text + thicker border */
.bar.product{border-width:2px;font-weight:700}
/* Category: service — default */

/* dep dot */
.bar.has-dep::after{content:'';position:absolute;left:-5px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:#7F77DD;opacity:.6}

/* hover states */
.bar.dimmed{opacity:.15!important}
.bar.highlighted{box-shadow:0 0 0 2px #534AB7!important;z-index:10;opacity:1!important}

.bar-label{pointer-events:none;overflow:hidden;text-overflow:ellipsis;flex:1;position:relative;z-index:1}
.bar-cat{position:relative;z-index:1;font-size:8px;font-weight:400;opacity:.65;margin-left:4px;flex:none;text-transform:uppercase;letter-spacing:.03em}
.resize-r{position:absolute;right:0;top:0;width:7px;height:100%;cursor:col-resize;z-index:4;border-radius:0 5px 5px 0}
.resize-r:hover{background:rgba(0,0,0,0.12)}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#E24B4A;opacity:.5;z-index:6;pointer-events:none}
.today-label{position:absolute;top:2px;font-size:8px;color:#E24B4A;white-space:nowrap;pointer-events:none;z-index:7}
#ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.75;border-radius:5px;display:none;align-items:center;padding:0 8px;font-size:10px;font-weight:500;height:26px;white-space:nowrap}
.drop-line{position:absolute;left:0;right:0;height:3px;background:#378ADD;border-radius:2px;z-index:50;pointer-events:none}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:1000;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:20px;min-width:340px;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,0.15)}
.modal h3{font-size:14px;font-weight:500;margin-bottom:14px}
.modal label{font-size:11px;color:#666;display:block;margin-bottom:4px}
.modal input,.modal select{width:100%;padding:6px 10px;border:0.5px solid #ccc;border-radius:6px;font-size:12px;margin-bottom:12px;background:#fff;color:#1a1a18}
.dep-list{border:0.5px solid #ccc;border-radius:6px;padding:6px;margin-bottom:12px;max-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.dep-item{display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:4px;cursor:pointer;font-size:12px;color:#3d3d3a}
.dep-item:hover{background:#f5f5f3}
.dep-item input[type=checkbox]{width:13px;height:13px;cursor:pointer;accent-color:#534AB7;flex:none}
.dep-item.checked{background:#EEEDFE;color:#3C3489}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.modal-row{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="app">
<h1>KeyGuru — Roadmap 2026</h1>
<div class="toolbar">
  <button onclick="addWeeks(4)">+ 4 týdny</button>
  <button onclick="addWeeks(-4)">- 4 týdny</button>
  <button onclick="addRow()">+ Řádek</button>
  <button onclick="openAddBar()">+ Položka</button>
  <button class="primary" onclick="saveData()">Uložit</button>
  <span class="status" id="status">
    <span class="sync-dot" id="sync-dot" style="background:#aaa"></span>
    <span id="status-text">Načítám...</span>
  </span>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch" style="background:#FEF3C7;border:1px solid #BA7517"></div>service
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#FEF3C7;border:1px solid #BA7517;border-width:2px"></div><b>product</b>
    </div>
  </div>
</div>
<div class="gantt-wrap" id="gantt-wrap">
  <div class="gantt" id="gantt"></div>
  <svg id="dep-svg" width="0" height="0"></svg>
</div>
</div>

<div id="ghost"></div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title">Nová položka</h3>
    <label>Název</label>
    <input type="text" id="m-label" placeholder="Název položky">
    <label>Řádek</label>
    <select id="m-row"></select>
    <label>Začátek (týden od 20.4.2026)</label>
    <input type="number" id="m-start" value="0" min="0">
    <label>Délka (týdny)</label>
    <input type="number" id="m-dur" value="4" min="1">
    <label>Typ</label>
    <select id="m-type">
      <option value="wip">Připravujeme (žlutá)</option>
      <option value="done">Hotové (modrá)</option>
      <option value="idea">Uvažujeme (zelená)</option>
    </select>
    <label>Kategorie</label>
    <select id="m-cat">
      <option value="service">Service</option>
      <option value="product">Product</option>
    </select>
    <label>Závisí na (lze vybrat více)</label>
    <div class="dep-list" id="m-deps"></div>
    <div class="modal-row">
      <div id="modal-del-wrap"></div>
      <div class="modal-btns">
        <button onclick="closeModal()">Zrušit</button>
        <button class="primary" onclick="confirmModal()">Uložit</button>
      </div>
    </div>
  </div>
</div>

<script>
const BIN_ID  = '69e97051aaba88219729eb4e';
const API_KEY = '$2a$10$Id1oXfXml.FyfHg0w301QOI3u2QaaQKVGCyKYkj0xfHBzVeMIW7ue';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const LS_DATA = 'kgr-data-v7';
const WEEK_W  = 56;
const START   = new Date('2026-04-20');

const PRODUCTS = new Set(['autoservisy','staysync','drivesync','birdie']);

const COLORS = {
  jan:   {bg:'#DAEAF7',border:'#185FA5',text:'#0C447C',initials:'JP'},
  martin:{bg:'#EAF3DE',border:'#3B6D11',text:'#27500A',initials:'MT'},
  tomas: {bg:'#FAEEDA',border:'#854F0B',text:'#633806',initials:'TH'},
};

const DEFAULT = {"totalWeeks":24,"sections":[{"id":"jan","name":"Jan Procházka","color":"jan","rows":[{"id":"jan-r1","label":"BX/GK3 železo","bars":[{"id":"b1","start":0,"dur":8,"type":"wip","label":"BX/GK3","cat":"service","deps":[]}]},{"id":"jan-r2","label":"GK3 elektro","bars":[{"id":"b2","start":0,"dur":8,"type":"wip","label":"GK3 elektronika","cat":"service","deps":[]}]},{"id":"jan-r3","label":"Falken","bars":[{"id":"b3","start":3,"dur":8,"type":"wip","label":"Birdie","cat":"product","deps":[]}]}]},{"id":"martin","name":"Martin Tauer","color":"martin","rows":[{"id":"mar-r1","label":"K2H úpravy","bars":[{"id":"b4","start":0,"dur":3,"type":"done","label":"K2H úpravy","cat":"service","deps":[]}]},{"id":"mar-r2","label":"Autoservisy","bars":[{"id":"b5","start":3,"dur":8,"type":"wip","label":"Autoservisy","cat":"product","deps":["b8","b7"]}]},{"id":"mar-r3","label":"K3","bars":[{"id":"b8","start":3,"dur":8,"type":"wip","label":"Core/Orchestration","cat":"service","deps":[]}]},{"id":"mar-r4","label":"DeviceMgmt KGR","bars":[{"id":"b7","start":5,"dur":2,"type":"wip","label":"DeviceMgmt KGR","cat":"service","deps":["b2"]}]},{"id":"mar-r5","label":"Core/Orchestration","bars":[{"id":"b6","start":7,"dur":4,"type":"wip","label":"BX/GK3 app","cat":"service","deps":["b2"]}]},{"id":"mar-r6","label":"API","bars":[{"id":"b9","start":5,"dur":2,"type":"wip","label":"API","cat":"service","deps":["b8"]},{"id":"b200","start":3,"dur":1,"type":"wip","label":"API copy K2H","cat":"service","deps":["b4"]}]}]},{"id":"tomas","name":"Tomáš Haubert","color":"tomas","rows":[{"id":"tom-r1","label":"StaySync","bars":[{"id":"b10","start":0,"dur":6,"type":"wip","label":"StaySync","cat":"product","deps":[]}]},{"id":"tom-r2","label":"DeviceMgmt Falken","bars":[{"id":"b11","start":3,"dur":4,"type":"wip","label":"DeviceMgmt Falken","cat":"service","deps":["b3"]}]},{"id":"tom-r3","label":"User Mgmt","bars":[{"id":"b12","start":3,"dur":2,"type":"wip","label":"User Mgmt","cat":"service","deps":["b8"]}]},{"id":"tom-r4","label":"Operator FE","bars":[{"id":"b13","start":5,"dur":4,"type":"wip","label":"Operator FE","cat":"service","deps":["b9"]}]},{"id":"tom-r5","label":"DriveSync","bars":[{"id":"b14","start":7,"dur":4,"type":"wip","label":"DriveSync","cat":"product","deps":["b8","b9"]}]}]}]};

let data = null;
let editingBar = null;
let nextId = 300;
let saveTimer = null;
let hoveredBarId = null; // track current hover globally

function setStatus(msg,color){
  document.getElementById('sync-dot').style.background=color;
  document.getElementById('status-text').textContent=msg;
}

function migrate(d){
  if(!d||!d.sections)return d;
  for(const s of d.sections)for(const r of s.rows)for(const b of r.bars){
    if(b.dep&&!b.deps){b.deps=[b.dep];delete b.dep;}
    if(!b.deps)b.deps=[];
    if(!b.cat){
      b.cat=PRODUCTS.has(b.label.toLowerCase())?'product':'service';
    }
  }
  return d;
}

async function loadData(){
  setStatus('Načítám...','#BA7517');
  const ls=localStorage.getItem(LS_DATA);
  if(ls){data=migrate(JSON.parse(ls));render();}
  try{
    const r=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':API_KEY,'X-Bin-Meta':'false'}});
    if(r.ok){
      const remote=migrate(await r.json());
      if(remote&&remote.sections){
        data=remote;localStorage.setItem(LS_DATA,JSON.stringify(data));render();
        setStatus('Synchronizováno','#3B6D11');return;
      }
    }
    if(!data){data=migrate(JSON.parse(JSON.stringify(DEFAULT)));render();await saveData();return;}
    setStatus('Synchronizováno','#3B6D11');
  }catch(e){
    if(!data){data=migrate(JSON.parse(JSON.stringify(DEFAULT)));render();}
    setStatus('Offline — lokální data','#A32D2D');
  }
}

async function saveData(){
  if(!data)return;
  localStorage.setItem(LS_DATA,JSON.stringify(data));
  setStatus('Ukládám...','#BA7517');
  try{
    const r=await fetch(BIN_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(data)});
    if(r.ok){
      const t=new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
      setStatus(`Uloženo ${t}`,'#3B6D11');
    }else setStatus('Chyba — uloženo lokálně','#A32D2D');
  }catch(e){setStatus('Offline — uloženo lokálně','#A32D2D');}
}

function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveData,1500);}
function weekLabel(i){const d=new Date(START);d.setDate(d.getDate()+i*7);return d.getDate()+'.'+(d.getMonth()+1)+'.';}
function isMonthStart(i){if(!i)return false;const d=new Date(START);d.setDate(d.getDate()+i*7);const p=new Date(START);p.setDate(p.getDate()+(i-1)*7);return d.getMonth()!==p.getMonth();}
function todayWeek(){return(new Date()-START)/(7*24*3600*1000);}
function addWeeks(n){data.totalWeeks=Math.max(8,data.totalWeeks+n);render();scheduleSave();}
function allBars(){const res=[];for(const s of data.sections)for(const r of s.rows)for(const b of r.bars)res.push(b);return res;}

function addRow(){
  const secId=prompt('Přidat řádek do sekce (jan / martin / tomas):','jan');
  if(!secId)return;
  const sec=data.sections.find(s=>s.id===secId);
  if(!sec){alert('Sekce nenalezena');return;}
  const label=prompt('Název řádku:','Nový řádek');
  if(!label)return;
  sec.rows.push({id:'r'+Date.now(),label,bars:[]});
  render();scheduleSave();
}

function deleteRow(rowId){
  for(const sec of data.sections){
    const idx=sec.rows.findIndex(r=>r.id===rowId);
    if(idx!==-1){
      if(!confirm(`Smazat řádek "${sec.rows[idx].label}"?`))return;
      sec.rows.splice(idx,1);render();scheduleSave();return;
    }
  }
}

function openAddBar(){
  editingBar=null;
  document.getElementById('modal-title').textContent='Nová položka';
  document.getElementById('m-label').value='';
  document.getElementById('m-start').value=0;
  document.getElementById('m-dur').value=4;
  document.getElementById('m-type').value='wip';
  document.getElementById('m-cat').value='service';
  document.getElementById('modal-del-wrap').innerHTML='';
  fillRowSelect();
  fillDepList(null,[]);
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('m-label').focus(),50);
}

function fillRowSelect(sel){
  const el=document.getElementById('m-row');el.innerHTML='';
  for(const sec of data.sections)for(const row of sec.rows){
    const o=document.createElement('option');
    o.value=row.id;o.textContent=sec.name.split(' ')[0]+' — '+row.label;
    if(row.id===sel)o.selected=true;el.appendChild(o);
  }
}

function fillDepList(currentBarId,currentDeps){
  const el=document.getElementById('m-deps');el.innerHTML='';
  const bars=allBars().filter(b=>b.id!==currentBarId);
  if(!bars.length){el.innerHTML='<span style="font-size:11px;color:#aaa;padding:4px">Žádné jiné položky</span>';return;}
  for(const bar of bars){
    const checked=currentDeps.includes(bar.id);
    const item=document.createElement('label');
    item.className='dep-item'+(checked?' checked':'');
    item.innerHTML=`<input type="checkbox" value="${bar.id}"${checked?' checked':''}> ${bar.label}`;
    item.querySelector('input').addEventListener('change',function(){
      item.classList.toggle('checked',this.checked);
    });
    el.appendChild(item);
  }
}

function getSelectedDeps(){
  return Array.from(document.querySelectorAll('#m-deps input[type=checkbox]:checked')).map(i=>i.value);
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  editingBar=null;
  // BUG FIX: reset hover state when modal closes
  hoveredBarId=null;
  clearHighlight();
}

function confirmModal(){
  const label=document.getElementById('m-label').value.trim();
  if(!label){alert('Zadej název');return;}
  const rowId=document.getElementById('m-row').value;
  const start=parseInt(document.getElementById('m-start').value)||0;
  const dur=parseInt(document.getElementById('m-dur').value)||4;
  const type=document.getElementById('m-type').value;
  const cat=document.getElementById('m-cat').value;
  const deps=getSelectedDeps();
  if(editingBar){
    Object.assign(editingBar.bar,{label,start,dur,type,cat,deps});
    if(editingBar.rowId!==rowId){
      const o=findRow(editingBar.rowId),n=findRow(rowId);
      if(o&&n){o.bars=o.bars.filter(b=>b.id!==editingBar.bar.id);n.bars.push(editingBar.bar);}
    }
  }else{
    const row=findRow(rowId);
    if(row)row.bars.push({id:'b'+(nextId++),start,dur,type,cat,label,deps});
  }
  hoveredBarId=null;
  closeModal();render();scheduleSave();
}

function deleteBar(barId){
  for(const sec of data.sections)for(const row of sec.rows){
    const idx=row.bars.findIndex(b=>b.id===barId);
    if(idx!==-1){
      row.bars.splice(idx,1);
      for(const b of allBars())b.deps=(b.deps||[]).filter(id=>id!==barId);
      hoveredBarId=null;
      closeModal();render();scheduleSave();return;
    }
  }
}

function findRow(id){for(const s of data.sections){const r=s.rows.find(r=>r.id===id);if(r)return r;}return null;}
function findBar(id){for(const s of data.sections)for(const r of s.rows){const b=r.bars.find(b=>b.id===id);if(b)return{bar:b,row:r,sec:s};}return null;}

function pushFollowing(row,barId,delta){
  if(!delta)return;
  const bar=row.bars.find(b=>b.id===barId);if(!bar)return;
  const end=bar.start+bar.dur;
  for(const b of row.bars)if(b.id!==barId&&b.start>=end-(delta>0?delta:0))b.start=Math.max(0,b.start+delta);
}

function render(){
  if(!data)return;
  const W=data.totalWeeks,tw=todayWeek();
  let html='<div class="header-row"><div class="header-left">Kdo / co</div>';
  html+=`<div class="header-weeks" style="position:relative;width:${W*WEEK_W}px">`;
  for(let i=0;i<W;i++){
    const ms=i>0&&isMonthStart(i)?' month-start':'';
    html+=`<div class="week-hdr${ms}"><div class="week-num">T${i+1}</div>${weekLabel(i)}</div>`;
  }
  html+=`<div class="today-line" style="left:${tw*WEEK_W}px"></div>`;
  html+=`<div class="today-label" style="left:${tw*WEEK_W+4}px">dnes</div>`;
  html+='</div></div>';

  for(const sec of data.sections){
    const c=COLORS[sec.color]||COLORS.jan;
    html+=`<div class="section-hdr"><span class="avatar" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">${c.initials}</span>${sec.name}</div>`;
    for(const row of sec.rows){
      html+=`<div class="row" data-row="${row.id}"><div class="row-left"><div class="row-label" contenteditable="true" data-row-label="${row.id}" spellcheck="false">${row.label}</div><button class="row-del" onclick="deleteRow('${row.id}')" title="Smazat řádek">×</button></div>`;
      html+=`<div class="timeline" data-row="${row.id}" style="width:${W*WEEK_W}px"><div class="week-bg">`;
      for(let i=0;i<W;i++){
        const ms=i>0&&isMonthStart(i)?' month-start':'';
        const td=(i<=tw&&tw<i+1)?' today-cell':'';
        html+=`<div class="week-bg-cell${ms}${td}"></div>`;
      }
      html+='</div>';
      for(const bar of row.bars){
        const hd=(bar.deps&&bar.deps.length)?' has-dep':'';
        const cat=bar.cat||'service';
        html+=`<div class="bar ${bar.type} ${cat}${hd}" data-bar="${bar.id}" style="left:${bar.start*WEEK_W}px;width:${bar.dur*WEEK_W}px" title="${bar.label} (T${bar.start+1}–T${bar.start+bar.dur}) [${cat}]"><span class="bar-label">${bar.label}</span><div class="resize-r" data-resize="${bar.id}"></div></div>`;
      }
      html+='</div></div>';
    }
  }
  document.getElementById('gantt').innerHTML=html;
  updateSvg();
  attachEvents();
  // BUG FIX: restore hover state after re-render
  if(hoveredBarId){
    highlightRelated(hoveredBarId);
  }
}

function updateSvg(){
  const g=document.getElementById('gantt');
  const svg=document.getElementById('dep-svg');
  svg.setAttribute('width',g.scrollWidth);
  svg.setAttribute('height',g.scrollHeight);
  svg.innerHTML='<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#7F77DD" opacity="0.8"/></marker></defs>';
}

function getBarRect(barId){
  const el=document.querySelector(`[data-bar="${barId}"]`);
  if(!el)return null;
  const gr=document.getElementById('gantt').getBoundingClientRect();
  const br=el.getBoundingClientRect();
  return{x1:br.left-gr.left,x2:br.right-gr.left,y:br.top-gr.top+br.height/2};
}

function drawDeps(hoveredId){
  updateSvg();
  const svg=document.getElementById('dep-svg');
  const bars=allBars();
  const allDeps=[];
  for(const bar of bars)for(const depId of(bar.deps||[]))allDeps.push({from:depId,to:bar.id});
  if(!allDeps.length)return;
  const related=new Set();
  if(hoveredId){
    related.add(hoveredId);
    for(const{from,to}of allDeps){
      if(to===hoveredId)related.add(from);
      if(from===hoveredId)related.add(to);
    }
  }
  const defs=svg.innerHTML.match(/<defs>[\s\S]*?<\/defs>/)[0];
  let paths='';
  for(const{from,to}of allDeps){
    if(hoveredId&&!related.has(from)&&!related.has(to))continue;
    const f=getBarRect(from);const t=getBarRect(to);
    if(!f||!t)continue;
    const isActive=hoveredId&&related.has(from)&&related.has(to);
    const color=isActive?'#534AB7':'#AFA9EC';
    const op=isActive?0.9:0.4;const sw=isActive?1.8:1;
    const dash=isActive?'':'5 3';
    const x1=f.x2+1,y1=f.y,x2=t.x1-1,y2=t.y;
    const mx=x1+(x2-x1)*0.5;
    const d=Math.abs(y1-y2)<3?`M${x1},${y1} L${x2},${y2}`:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
    paths+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-opacity="${op}" stroke-dasharray="${dash}" marker-end="url(#arr)"/>`;
  }
  svg.innerHTML=defs+paths;
}

function getRelated(hoveredId){
  const related=new Set([hoveredId]);
  for(const bar of allBars())for(const depId of(bar.deps||[])){
    if(bar.id===hoveredId)related.add(depId);
    if(depId===hoveredId)related.add(bar.id);
  }
  return related;
}

function highlightRelated(hoveredId){
  const related=getRelated(hoveredId);
  document.querySelectorAll('.bar').forEach(el=>{
    const bid=el.dataset.bar;
    el.classList.toggle('dimmed',!related.has(bid));
    el.classList.toggle('highlighted',related.has(bid));
  });
  drawDeps(hoveredId);
}

function clearHighlight(){
  document.querySelectorAll('.bar').forEach(el=>{el.classList.remove('dimmed','highlighted');});
  updateSvg();
}

function attachEvents(){
  document.querySelectorAll('[data-row-label]').forEach(el=>{
    el.addEventListener('blur',()=>{const r=findRow(el.dataset.rowLabel);if(r){r.label=el.textContent.trim();scheduleSave();}});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});
  });
  document.querySelectorAll('.bar').forEach(el=>{
    el.addEventListener('mousedown',onBarMouseDown);
    el.addEventListener('dblclick',onBarDblClick);
    el.addEventListener('mouseenter',()=>{
      hoveredBarId=el.dataset.bar;
      highlightRelated(hoveredBarId);
    });
    el.addEventListener('mouseleave',()=>{
      hoveredBarId=null;
      clearHighlight();
    });
  });
  document.querySelectorAll('.resize-r').forEach(el=>el.addEventListener('mousedown',onResizeDown));
}

function onBarDblClick(e){
  e.stopPropagation();
  // BUG FIX: don't clear highlight here - closeModal will do it after save
  const found=findBar(e.currentTarget.dataset.bar);if(!found)return;
  editingBar={bar:found.bar,rowId:found.row.id};
  document.getElementById('modal-title').textContent='Upravit položku';
  document.getElementById('m-label').value=found.bar.label;
  document.getElementById('m-start').value=found.bar.start;
  document.getElementById('m-dur').value=found.bar.dur;
  document.getElementById('m-type').value=found.bar.type;
  document.getElementById('m-cat').value=found.bar.cat||'service';
  fillRowSelect(found.row.id);
  fillDepList(found.bar.id,found.bar.deps||[]);
  document.getElementById('modal-del-wrap').innerHTML=`<button class="danger" onclick="deleteBar('${found.bar.id}')">Smazat</button>`;
  document.getElementById('modal').classList.add('open');
}

function onBarMouseDown(e){
  if(e.target.classList.contains('resize-r'))return;
  e.preventDefault();
  const found=findBar(e.currentTarget.dataset.bar);if(!found)return;
  const{bar,row}=found;
  const startX=e.clientX,startY=e.clientY,origStart=bar.start;
  let moved=false,crossRow=false;
  const ghost=document.getElementById('ghost'),barEl=e.currentTarget;
  function onMove(e){
    if(!moved&&Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>4){
      moved=true;hoveredBarId=null;clearHighlight();
    }
    if(!moved)return;
    const dw=Math.round((e.clientX-startX)/WEEK_W);
    const targetRowEl=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-row]');
    const targetRow=targetRowEl?findRow(targetRowEl.dataset.row):null;
    if(targetRow&&targetRow.id!==row.id){
      crossRow=true;
      const fc=bar.type==='done'?'#DAEAF7':bar.type==='idea'?'#EAF3DE':'#FEF3C7';
      const bc=bar.type==='done'?'#185FA5':bar.type==='idea'?'#3B6D11':'#BA7517';
      const tc=bar.type==='done'?'#0C447C':bar.type==='idea'?'#27500A':'#633806';
      ghost.style.cssText=`display:flex;left:${e.clientX-60}px;top:${e.clientY-13}px;width:${bar.dur*WEEK_W}px;background:${fc};border:1px solid ${bc};color:${tc}`;
      ghost.textContent=bar.label;barEl.style.opacity='0.3';
      document.querySelectorAll('.drop-line').forEach(l=>l.remove());
      const tl=targetRowEl?.querySelector('.timeline');
      if(tl){const dl=document.createElement('div');dl.className='drop-line';dl.style.top='0';tl.appendChild(dl);}
    }else{
      crossRow=false;ghost.style.display='none';barEl.style.opacity='1';
      document.querySelectorAll('.drop-line').forEach(l=>l.remove());
      const ns=Math.max(0,origStart+dw);
      if(ns!==bar.start){const d=ns-bar.start;bar.start=ns;pushFollowing(row,bar.id,d);render();}
    }
  }
  function onUp(e){
    window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);
    ghost.style.display='none';document.querySelectorAll('.drop-line').forEach(l=>l.remove());barEl.style.opacity='1';
    if(crossRow){
      const targetRowEl=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-row]');
      const targetRow=targetRowEl?findRow(targetRowEl.dataset.row):null;
      if(targetRow&&targetRow.id!==row.id){
        const tl=targetRowEl?.querySelector('.timeline');
        if(tl)bar.start=Math.max(0,Math.round((e.clientX-tl.getBoundingClientRect().left)/WEEK_W));
        row.bars=row.bars.filter(b=>b.id!==bar.id);targetRow.bars.push(bar);
      }
    }
    if(moved){render();scheduleSave();}
  }
  window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
}

function onResizeDown(e){
  e.preventDefault();e.stopPropagation();
  const found=findBar(e.currentTarget.dataset.resize);if(!found)return;
  const{bar,row}=found;const startX=e.clientX,origDur=bar.dur;
  function onMove(e){
    const nd=Math.max(1,origDur+Math.round((e.clientX-startX)/WEEK_W));
    if(nd!==bar.dur){const d=nd-bar.dur;bar.dur=nd;pushFollowing(row,bar.id,d);render();}
  }
  function onUp(){window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);scheduleSave();}
  window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
}

document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveData();}
});

loadData();
</script>
</body>
</html>
